[package]
name = "zclick-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py310"]

[dependencies]
zclick-core = { path = "../zclick-core", version = "=0.1.1-alpha.3" }
pyo3 = { version = "=0.30.1", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "=0.30.1"
