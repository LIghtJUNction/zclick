[workspace]
resolver = "3"
members = ["crates/zclick-core", "crates/zclick-python"]

[workspace.package]
version = "0.1.1-alpha.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zclick"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
