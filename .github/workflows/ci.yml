name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      full:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p zclick-core --release
      - run: cargo check --locked -p zclick-core --target wasm32-unknown-unknown
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: python scripts/audit_dependencies.py
      - run: python scripts/vendor_licenses.py --check

  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: ubuntu-latest, python: '3.14t', build_args: '--no-default-features'}
          - {os: ubuntu-latest, python: '3.15'}
          - {os: ubuntu-latest, python: '3.15t', build_args: '--no-default-features'}
          - {os: ubuntu-latest, python: 'pypy-3.11', build_args: '--no-default-features'}
          - {os: ubuntu-latest, python: 'pypy-3.12', build_args: '--no-default-features', typing_python: '3.12'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: runtime
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build native wheel
        env:
          BUILD_ARGS: ${{ matrix.build_args }}
        run: maturin build --release --locked --interpreter python --out dist $BUILD_ARGS
      - name: Install and inspect wheel
        id: install
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python scripts/check_wheel.py dist/*.whl
      - run: python -m pytest tests -q --junitxml=reports/project.xml -o junit_family=xunit1
      - name: Upstream compatibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/run_compatibility.py --output reports/normal -- -m 'not stress'
      - name: Public API contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python scripts/api_inventory.py --source .cache/click-source --output reports/api-reference.json
          python scripts/api_inventory.py --compare reports/api-reference.json --output reports/api.json
      # Mypy 1.20's compiler runtime requires CPython. Its target interpreter
      # remains the original PyPy runtime, including that wheel's type stubs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !cancelled() && steps.install.outcome == 'success' && startsWith(matrix.python, 'pypy-') }}
        with:
          python-version: ${{ matrix.typing_python || '3.11' }}
      - name: Install type checker for PyPy's declarations
        if: ${{ !cancelled() && steps.install.outcome == 'success' && startsWith(matrix.python, 'pypy-') }}
        run: python -m pip install mypy==1.20.2
      - name: Target typing examples
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TYPING_PYTHON: ${{ steps.runtime.outputs.python-path }}
        run: python -m mypy .cache/click-migrated/tests/typing --no-incremental --python-executable "$TYPING_PYTHON"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
          if-no-files-found: warn

  shells:
    name: Four real Shell runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - run: python -m pip install -r requirements-dev.txt
      - run: maturin build --release --locked --interpreter python --out dist
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Install pinned Shell runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          python scripts/install_test_shells.py
      - run: python scripts/check_shells.py --output reports/shells
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shell-evidence-linux
          path: reports/shells/
          if-no-files-found: error

  interpreter-boundary:
    name: Subinterpreter gap and safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - run: python -m pip install -r requirements-dev.txt
      - run: maturin build --release --locked --interpreter python --out dist
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - run: python scripts/check_subinterpreters.py --output reports/subinterpreters
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: interpreter-boundary-evidence
          path: reports/subinterpreters/
          if-no-files-found: error

  benchmark:
    if: ${{ inputs.full }}
    name: Measured Python API performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - run: python -m pip install -r requirements-dev.txt
      - run: maturin build --release --locked --interpreter python --out dist
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - run: python benchmarks/compare.py --iterations 1000 --repeats 9 --output reports/benchmarks.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-evidence
          path: reports/benchmarks.json
          if-no-files-found: error

  stress:
    if: ${{ inputs.full }}
    name: Stress / ${{ matrix.runtime.os }} / ${{ matrix.runtime.python }} / ${{ matrix.case }}
    runs-on: ${{ matrix.runtime.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: ubuntu-latest, python: 'pypy-3.11', build_args: '--no-default-features'}
          - {os: ubuntu-latest, python: 'pypy-3.12', build_args: '--no-default-features'}
          - {os: ubuntu-latest, python: '3.14t', build_args: '--no-default-features'}
          - {os: ubuntu-latest, python: '3.15t', build_args: '--no-default-features'}
        case: [thread_pool_with_exit, logging_sequential_invocations, gc_between_invocations, echo_via_pager_exception_cleanup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build for the selected interpreter
        env:
          BUILD_ARGS: ${{ matrix.runtime.build_args }}
        run: maturin build --release --locked --interpreter python --out dist $BUILD_ARGS
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Run every case in one upstream stress function
        env:
          STRESS_CASE: ${{ matrix.case }}
        run: python scripts/run_stress.py --case "$STRESS_CASE" --workers 4 --batch-size 500 --output reports/stress
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-stress-${{ matrix.runtime.os }}-${{ matrix.runtime.python }}-${{ matrix.case }}
          path: |
            reports/
            !reports/**/candidate/**
          if-no-files-found: error

  release-evidence:
    if: ${{ inputs.full }}
    needs: [rust, python, shells, interpreter-boundary, benchmark, stress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shell-evidence-linux
          path: shell-evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interpreter-boundary-evidence
          path: interpreter-boundary
      - name: Validate complete evidence for the immutable release commit
        env:
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
        run: python scripts/release_gate.py --reports evidence/*/*/summary.json --api evidence/*/api.json --shell shell-evidence/summary.json --boundary interpreter-boundary/summary.json --implementation "$RELEASE_SHA"
